<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>GPS San Andreas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
/* Si consigues la fuente "Pricedown" (la del logo de GTA), ponla junto a este archivo como pricedown.ttf */
@font-face{font-family:"Pricedown";src:url("fuentes/pricedown.ttf") format("truetype"),url("fuentes/pricedown.otf") format("opentype"),url("pricedown.ttf") format("truetype"),url("pricedown bl.ttf") format("truetype");font-display:swap}
:root{
  --sa-title:"Pricedown","Anton",Impact,sans-serif;
  --sa-ui:"Oswald","Arial Narrow",Arial,sans-serif;
  --sa-white:#f3f3f3;
  --sa-green-l:#5fa04e;
  --sa-blue:#acc8ff;
  --sa-orange:#e1a33a;
  --panel:rgba(12,12,12,.88);
  --outline:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 2px 0 #000,0 -2px 0 #000,2px 0 0 #000,-2px 0 0 #000;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#b4b4b0;color:var(--sa-white);font-family:var(--sa-ui);overflow:hidden;-webkit-tap-highlight-color:transparent}
#map{position:absolute;inset:0}
.maplibregl-ctrl-attrib{background:rgba(0,0,0,.55)!important;font-size:9px}
.maplibregl-ctrl-attrib a{color:#ccc!important}
.maplibregl-ctrl-attrib-button{filter:invert(1)}

/* botones / paneles: tarjetas oscuras redondeadas como en CarPlay, con letras de GTA */
.card{background:var(--panel);border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.btn{height:46px;min-width:46px;padding:0 16px;border:0;border-radius:23px;background:var(--panel);color:#fff;font:700 15px var(--sa-ui);letter-spacing:.5px;text-transform:uppercase;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.btn:active{transform:scale(.97)}
.btn.on{color:var(--sa-blue)}
.btn.primary{background:#1f6fe0}
.btn.danger{background:#d13434}

/* búsqueda */
#top{position:absolute;top:12px;left:12px;right:12px;z-index:10;max-width:520px;display:flex;flex-direction:column;gap:8px}
body.nav #top{display:none}
#searchRow{display:flex;gap:8px}
#q{flex:1;min-width:0;height:48px;padding:0 18px;border:0;border-radius:24px;background:var(--panel);color:#fff;font:500 17px var(--sa-ui);outline:none;box-shadow:0 3px 10px rgba(0,0,0,.35)}
#q::placeholder{color:#9a9a9a}
#results{display:none;max-height:46vh;overflow:auto;padding:6px 0}
#results div{padding:11px 16px;cursor:pointer;font-size:15px;line-height:1.3}
#results div:active,#results div:hover{background:rgba(255,255,255,.08)}
#results small{display:block;color:#9a9a9a;font-size:12px}

/* instrucción (arriba izquierda, como el video) */
#instr{position:absolute;top:12px;left:12px;z-index:10;display:none;align-items:center;gap:12px;padding:12px 18px 12px 12px;max-width:min(calc(100vw - 150px),420px)}
body.nav #instr{display:flex}
#instrIcon{width:50px;height:50px;flex:none}
#instrDist{font:34px/1 var(--sa-title);color:#fff;text-shadow:var(--outline);letter-spacing:1px}
#instrText{font:500 15px/1.25 var(--sa-ui);color:#ddd;margin-top:3px}

/* HUD reloj + velocidad */
#hud{position:absolute;right:14px;top:72px;z-index:9;text-align:right;pointer-events:none}
body.nav #hud{top:128px}
#clock{font:42px/1 var(--sa-title);color:#fff;text-shadow:var(--outline);letter-spacing:2px}
#speed{font:32px/1.1 var(--sa-title);color:var(--sa-green-l);text-shadow:var(--outline);letter-spacing:2px}
#speed span{font-size:18px}
#btnEnd{position:absolute;top:12px;right:12px;z-index:11;display:none}
body.nav #btnEnd{display:block}

/* nombre de zona */
#zone{position:absolute;right:16px;bottom:120px;z-index:9;font:38px/1 var(--sa-title);color:#fff;text-shadow:var(--outline);text-align:right;max-width:75vw;opacity:0;transition:opacity 1s;pointer-events:none;letter-spacing:1px}
#zone.show{opacity:1}

/* tarjeta de llegada (abajo izquierda, como el video) */
#trip{position:absolute;left:12px;bottom:18px;z-index:10;display:none;gap:22px;padding:12px 20px}
body.nav #trip{display:flex}
#trip div{text-align:center;font:500 12px var(--sa-ui);color:#aaa;text-transform:lowercase}
#trip b{display:block;font:26px/1 var(--sa-title);color:#fff;letter-spacing:1px;font-weight:400}
#trip .g b{color:var(--sa-green-l)}

/* botones flotantes */
#fabs{position:absolute;right:12px;bottom:18px;z-index:10;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
body.has-card #fabs{bottom:212px}

/* tarjeta de destino */
#card{position:absolute;left:12px;right:12px;bottom:14px;z-index:12;max-width:520px;margin:0 auto;padding:16px;display:none}
body.has-card:not(.nav) #card{display:block}
#cardTitle{font:28px/1.05 var(--sa-title);color:#fff;text-shadow:var(--outline);letter-spacing:1px}
#cardSub{color:#a9a9a9;font-size:13px;margin-top:4px}
#cardStats{display:flex;gap:22px;margin:12px 0 14px}
#cardStats div{font:700 12px var(--sa-ui);color:#999;text-transform:uppercase;letter-spacing:1px}
#cardStats b{display:block;font:28px/1 var(--sa-title);color:var(--sa-green-l);text-shadow:var(--outline);letter-spacing:1px;font-weight:400}
#cardBtns{display:flex;gap:10px}
#cardBtns .btn{flex:1}

/* carteles */
#banner{position:absolute;left:0;right:0;top:36%;z-index:20;text-align:center;pointer-events:none;opacity:0;transition:opacity .4s}
#banner.show{opacity:1}
#bannerBig{font:clamp(40px,11vw,76px)/1 var(--sa-title);color:var(--sa-orange);text-shadow:var(--outline);letter-spacing:2px}
#bannerSmall{font:clamp(20px,5vw,30px)/1.2 var(--sa-title);color:#fff;text-shadow:var(--outline);margin-top:6px}
#toast{position:absolute;left:50%;transform:translateX(-50%);top:80px;z-index:30;padding:10px 16px;font-size:15px;max-width:90vw;display:none;text-align:center}

/* blips */
.blip{cursor:pointer;line-height:0}
.blip svg,.blip img{filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.blip img,.player img{image-rendering:pixelated;display:block}
.player{line-height:0;pointer-events:none}
.maplibregl-popup-content{background:#111;color:#fff;border-radius:12px;padding:12px 14px;font:500 14px var(--sa-ui)}
.maplibregl-popup-content b{font:20px var(--sa-title);font-weight:400;letter-spacing:1px}
.maplibregl-popup-content .btn{margin-top:10px;width:100%;height:38px}
.maplibregl-popup-tip{border-top-color:#111!important;border-bottom-color:#111!important}
.maplibregl-popup-close-button{color:#aaa;font-size:18px}
</style>
</head>
<body>
<div id="map"></div>

<div id="top">
  <div id="searchRow">
    <input id="q" type="search" placeholder="¿A dónde vamos, CJ?" autocomplete="off" enterkeyhint="search">
  </div>
  <div id="results" class="card"></div>
</div>

<div id="instr" class="card"><svg id="instrIcon" viewBox="0 0 52 52"></svg><div><div id="instrDist">--</div><div id="instrText">Calculando…</div></div></div>
<button id="btnEnd" class="btn danger">Terminar</button>

<div id="hud"><div id="clock">00:00</div><div id="speed">000<span> KM/H</span></div></div>
<div id="zone"></div>

<div id="trip" class="card">
  <div><b id="tEta">--:--</b>llegada</div>
  <div class="g"><b id="tMin">--</b>min</div>
  <div><b id="tKm">--</b>km</div>
</div>

<div id="fabs">
  <button class="btn" id="btnPoi">Blips</button>
  <button class="btn on" id="btnVoice">Voz</button>
  <button class="btn" id="btnCenter" aria-label="Centrar en mí">
    <svg width="22" height="22" viewBox="0 0 22 22" style="vertical-align:middle"><path d="M11 2 L19 19 L11 15 L3 19 Z" fill="#fff" stroke="#000" stroke-width="2" stroke-linejoin="round"/></svg>
  </button>
</div>

<div id="card" class="card">
  <div id="cardTitle">Destino</div>
  <div id="cardSub"></div>
  <div id="cardStats"><div>Distancia<b id="stDist">--</b></div><div>Tiempo<b id="stTime">--</b></div><div>Llegada<b id="stEta">--</b></div></div>
  <div id="cardBtns">
    <button class="btn primary" id="btnGo">Iniciar</button>
    <button class="btn" id="btnCancel">Cancelar</button>
  </div>
</div>

<div id="banner"><div id="bannerBig"></div><div id="bannerSmall"></div></div>
<div id="toast" class="card"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
/* =====================================================================
   GPS SAN ANDREAS
   Mapa vectorial real (OpenStreetMap vía OpenFreeMap, sin API key)
   pintado con el estilo del mapa de GTA San Andreas, rutas reales (OSRM),
   búsqueda (Nominatim) y lugares cercanos (Overpass).
   ===================================================================== */

const CONFIG = {
  inicio: [-71.5350, -16.3989],     // [lng, lat] si no hay GPS: Plaza de Armas de Arequipa
  perfil: 'driving',
  osrm: 'https://router.project-osrm.org/route/v1/',
  nominatim: 'https://nominatim.openstreetmap.org/',
  overpass: 'https://overpass-api.de/api/interpreter',
  tiles: 'https://tiles.openfreemap.org/planet',
  glyphs: 'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',
  desvioMetros: 45,
  inclinacionNav: 58,               // inclinación 3D de la cámara al navegar
};

/* -------- colores del mapa de San Andreas (cámbialos a tu gusto) -------- */
const SA = {
  fondo:     '#b4b4b0',   // terreno gris claro
  urbano:    '#a9a9a5',
  agua:      '#6d8db5',
  pasto:     '#5c9e3e',
  parque:    '#4f9436',
  cancha:    '#86c065',
  arena:     '#c9b98a',
  calle:     '#232323',   // calles negras
  borde:     '#8c8c88',
  avenida:   '#2c2c2c',
  autopista: '#3a3a3a',
  tren:      '#555',
  ruta:      '#f2c230',   // línea de la ruta (dorada)
  rutaBorde: '#000',
};

/* ---------------------------- estilo del mapa ---------------------------- */
const W = (base, stops) => ['interpolate', ['exponential', 1.6], ['zoom'], ...stops.flatMap(([z, w]) => [z, w * base])];
const roadClass = list => ['match', ['get', 'class'], list, true, false];
const nombre = ['upcase', ['coalesce', ['get', 'name:es'], ['get', 'name'], '']];
const style = {
  version: 8,
  glyphs: CONFIG.glyphs,
  sources: { omt: { type: 'vector', url: CONFIG.tiles } },
  layers: [
    { id: 'fondo', type: 'background', paint: { 'background-color': SA.fondo } },
    { id: 'urbano', type: 'fill', source: 'omt', 'source-layer': 'landuse', filter: roadClass(['residential','commercial','industrial','retail']), paint: { 'fill-color': SA.urbano } },
    { id: 'pasto', type: 'fill', source: 'omt', 'source-layer': 'landcover', filter: roadClass(['grass','wood','farmland','wetland']), paint: { 'fill-color': SA.pasto } },
    { id: 'arena', type: 'fill', source: 'omt', 'source-layer': 'landcover', filter: roadClass(['sand']), paint: { 'fill-color': SA.arena } },
    { id: 'parque', type: 'fill', source: 'omt', 'source-layer': 'park', paint: { 'fill-color': SA.parque } },
    { id: 'canchas', type: 'fill', source: 'omt', 'source-layer': 'landuse', filter: roadClass(['pitch','stadium','cemetery','school','playground']), paint: { 'fill-color': SA.cancha } },
    { id: 'agua', type: 'fill', source: 'omt', 'source-layer': 'water', paint: { 'fill-color': SA.agua } },
    { id: 'rios', type: 'line', source: 'omt', 'source-layer': 'waterway', paint: { 'line-color': SA.agua, 'line-width': W(1, [[10, .5], [18, 6]]) } },
    { id: 'aeropuerto', type: 'line', source: 'omt', 'source-layer': 'aeroway', filter: ['==', ['geometry-type'], 'LineString'], paint: { 'line-color': '#3a3a3a', 'line-width': W(1, [[11, 1], [18, 40]]) } },

    // bordes de calles
    { id: 'borde-menor', type: 'line', source: 'omt', 'source-layer': 'transportation', filter: roadClass(['minor','service']), layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': SA.borde, 'line-width': W(1, [[12, 1.4], [14, 4], [16, 11], [18, 34], [20, 90]]) } },
    { id: 'borde-mayor', type: 'line', source: 'omt', 'source-layer': 'transportation', filter: roadClass(['primary','secondary','tertiary','trunk','motorway']), layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': SA.borde, 'line-width': W(1, [[8, 1.5], [12, 4], [14, 8], [16, 18], [18, 50], [20, 130]]) } },
    // calles
    { id: 'senderos', type: 'line', source: 'omt', 'source-layer': 'transportation', filter: roadClass(['path','track']), minzoom: 15, paint: { 'line-color': '#6e6e6a', 'line-width': 1.2, 'line-dasharray': [2, 1.5] } },
    { id: 'tren', type: 'line', source: 'omt', 'source-layer': 'transportation', filter: roadClass(['rail','transit']), paint: { 'line-color': SA.tren, 'line-width': 2, 'line-dasharray': [3, 2] } },
    { id: 'calle-menor', type: 'line', source: 'omt', 'source-layer': 'transportation', filter: roadClass(['minor','service']), layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': SA.calle, 'line-width': W(1, [[12, .8], [14, 2.8], [16, 8.5], [18, 28], [20, 80]]) } },
    { id: 'calle-mayor', type: 'line', source: 'omt', 'source-layer': 'transportation', filter: roadClass(['primary','secondary','tertiary']), layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': SA.avenida, 'line-width': W(1, [[8, 1], [12, 3], [14, 6], [16, 14], [18, 42], [20, 115]]) } },
    { id: 'autopista', type: 'line', source: 'omt', 'source-layer': 'transportation', filter: roadClass(['trunk','motorway']), layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': SA.autopista, 'line-width': W(1, [[6, 1], [12, 3.5], [14, 7], [16, 16], [18, 46], [20, 120]]) } },

    // ruta (se rellena desde el código)
    { id: 'ruta-borde', type: 'line', source: 'ruta', layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': SA.rutaBorde, 'line-width': W(1, [[10, 5], [14, 9], [16, 14], [18, 30], [20, 70]]) } },
    { id: 'ruta', type: 'line', source: 'ruta', layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': SA.ruta, 'line-width': W(1, [[10, 3], [14, 6], [16, 9], [18, 22], [20, 56]]) } },

    // nombres de calles (blancos, en mayúsculas, sobre la calle negra)
    { id: 'nombres-calles', type: 'symbol', source: 'omt', 'source-layer': 'transportation_name', minzoom: 14,
      layout: { 'symbol-placement': 'line', 'text-field': nombre, 'text-font': ['Noto Sans Bold'], 'text-size': ['interpolate', ['linear'], ['zoom'], 14, 9, 18, 14], 'text-letter-spacing': .08, 'text-max-angle': 30 },
      paint: { 'text-color': '#f2f2f2', 'text-halo-color': '#000', 'text-halo-width': 1.2 } },
    // nombres de lugares (como "OTAY RANCH HIGH SCHOOL" del video)
    { id: 'nombres-poi', type: 'symbol', source: 'omt', 'source-layer': 'poi', minzoom: 15, filter: ['<=', ['get', 'rank'], 14],
      layout: { 'text-field': nombre, 'text-font': ['Noto Sans Bold'], 'text-size': 11, 'text-letter-spacing': .05, 'text-max-width': 8 },
      paint: { 'text-color': '#111', 'text-halo-color': 'rgba(220,220,215,.85)', 'text-halo-width': 1.4 } },
    { id: 'nombres-zonas', type: 'symbol', source: 'omt', 'source-layer': 'place', filter: roadClass(['suburb','neighbourhood','quarter','city','town','village']),
      layout: { 'text-field': nombre, 'text-font': ['Noto Sans Bold'], 'text-size': ['match', ['get', 'class'], ['city', 'town'], 18, 13], 'text-letter-spacing': .12, 'text-max-width': 9 },
      paint: { 'text-color': '#fff', 'text-halo-color': '#000', 'text-halo-width': 2 } },
  ],
};
style.sources.ruta = { type: 'geojson', data: { type: 'FeatureCollection', features: [] } };

/* ------------------------------- utilidades ------------------------------ */
const $ = id => document.getElementById(id);
const toRad = d => d * Math.PI / 180;
function dist(a, b){ // [lng,lat]
  const dLat = toRad(b[1]-a[1]), dLng = toRad(b[0]-a[0]);
  const s = Math.sin(dLat/2)**2 + Math.cos(toRad(a[1]))*Math.cos(toRad(b[1]))*Math.sin(dLng/2)**2;
  return 2*6371000*Math.asin(Math.sqrt(s));
}
function bearing(a, b){
  const y = Math.sin(toRad(b[0]-a[0]))*Math.cos(toRad(b[1]));
  const x = Math.cos(toRad(a[1]))*Math.sin(toRad(b[1])) - Math.sin(toRad(a[1]))*Math.cos(toRad(b[1]))*Math.cos(toRad(b[0]-a[0]));
  return (Math.atan2(y, x)*180/Math.PI + 360) % 360;
}
const fmtDist = m => m >= 1000 ? (m/1000).toFixed(m >= 10000 ? 0 : 1) + ' KM' : (Math.round(m/10)*10) + ' M';
const fmtTime = s => { const m = Math.round(s/60); return m < 60 ? m + ' MIN' : Math.floor(m/60) + 'H ' + String(m%60).padStart(2,'0'); };
const fmtClock = d => String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
let toastT, bannerT, zoneT;
function toast(msg, ms=3200){ const t=$('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(toastT); toastT=setTimeout(()=>t.style.display='none', ms); }
function banner(big, small='', ms=3500){ $('bannerBig').textContent=big; $('bannerSmall').textContent=small; $('banner').classList.add('show'); clearTimeout(bannerT); bannerT=setTimeout(()=>$('banner').classList.remove('show'), ms); }

/* --------------------- iconos estilo radar de San Andreas ---------------- */
const ring = (inner, bg='#000') => `<svg width="26" height="26" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" fill="${bg}" stroke="#000" stroke-width="2"/>${inner}</svg>`;
const ICONOS = {
  hospital: ring('<path d="M10 6h4v4h4v4h-4v4h-4v-4H6v-4h4z" fill="#e0262b"/>', '#fff'),
  policia:  ring('<path d="M12 4l2.2 4.6 5 .6-3.7 3.4 1 5-4.5-2.5-4.5 2.5 1-5L4.8 9.2l5-.6z" fill="#3a6fd8" stroke="#fff" stroke-width=".9"/>'),
  gasolina: ring('<rect x="7" y="7" width="7" height="11" rx="1" fill="#f0c23b"/><rect x="8.5" y="8.5" width="4" height="3" fill="#000"/><path d="M14 9l3 2v5.5a1 1 0 0 1-2 0V13h-1" fill="none" stroke="#f0c23b" stroke-width="1.5"/>'),
  burger:   ring('<path d="M6 11a6 4 0 0 1 12 0z" fill="#e3a446"/><rect x="5.5" y="12" width="13" height="2" fill="#5ab04a"/><rect x="6" y="14.3" width="12" height="2" fill="#7a3d1f"/><path d="M6 16.6h12a2 1.6 0 0 1-2 1.6H8a2 1.6 0 0 1-2-1.6z" fill="#e3a446"/>'),
  pizza:    ring('<path d="M5 7l14 2-9 10z" fill="#f2c94c" stroke="#b5651d" stroke-width="1.4"/><circle cx="11" cy="10" r="1.3" fill="#c0392b"/><circle cx="13" cy="13" r="1.1" fill="#c0392b"/><circle cx="9.5" cy="13.5" r="1" fill="#c0392b"/>'),
  pollo:    ring('<path d="M14.5 6.5a4 4 0 0 1 0 6l-4 4-1.5-1.5-2 .5.5-2-1.5-1.5 4-4a4 4 0 0 1 4.5-1.5z" fill="#e3a446" stroke="#fff" stroke-width=".7"/><path d="M7 15l-2 3" stroke="#fff" stroke-width="2"/>'),
  dinero:   ring('<text x="12" y="17.5" text-anchor="middle" font-family="Arial Black,Arial" font-weight="900" font-size="15" fill="#4fbf3a">$</text>'),
  farmacia: ring('<path d="M10 6h4v4h4v4h-4v4h-4v-4H6v-4h4z" fill="#4fbf3a"/>'),
  gimnasio: ring('<rect x="5" y="9" width="2.5" height="6" fill="#ddd"/><rect x="16.5" y="9" width="2.5" height="6" fill="#ddd"/><rect x="7.5" y="10.5" width="9" height="3" fill="#ddd"/>'),
  ropa:     ring('<path d="M9 6l3 2 3-2 4 3-2 3-1.5-1V18h-7v-7L7 12 5 9z" fill="#e0262b" stroke="#fff" stroke-width=".7"/>'),
  barberia: ring('<circle cx="8" cy="16" r="2.3" fill="none" stroke="#fff" stroke-width="1.6"/><circle cx="16" cy="16" r="2.3" fill="none" stroke="#fff" stroke-width="1.6"/><path d="M9.5 14L16 5M14.5 14L8 5" stroke="#fff" stroke-width="1.6"/>'),
  bar:      ring('<path d="M7 7h10l-5 6z" fill="#acc8ff"/><path d="M12 13v4M9 18h6" stroke="#acc8ff" stroke-width="1.6"/>'),
  taller:   ring('<path d="M8 7h3v3l2 0 3 8h-3l-1-2h-4l-1 2H4z" fill="#e1a33a"/>'),
};
/* sa = número del icono original de San Andreas (lista: sampwiki.blast.hk/wiki/MapIcons)
   icon = dibujo de respaldo si la imagen no carga */
const POI_TIPOS = [
  { k: 'amenity=hospital',       sa: 22, icon: 'hospital', nombre: 'Hospital' },

/* imágenes de los iconos de SA: primero busca en tu carpeta iconos/ (Icon_22.gif, etc.)
   y si no están, las toma de la wiki de SA-MP. Si tampoco cargan, usa el dibujo SVG. */
const SA_ICON_URL = {
  2:'a/ad',4:'4/4e',5:'9/9c',7:'f/f1',10:'0/0e',14:'6/6d',17:'f/ff',22:'7/73',29:'6/68',30:'a/a0',36:'7/7b',39:'7/78',
  41:'4/48',44:'b/bb',45:'9/9d',48:'7/72',49:'a/a4',50:'3/3a',52:'6/61',54:'b/b6',55:'5/58',63:'d/db',
};
const CARPETA_ICONOS = 'iconos/';
function saImg(id, size, fallbackSvg){
  const wrap = document.createElement('div');
  const img = new Image(size, size); img.alt = '';
  const fuentes = [CARPETA_ICONOS + 'Icon_' + id + '.gif'];
  if (SA_ICON_URL[id]) fuentes.push('https://sampwiki.blast.hk/wroot/images2/' + SA_ICON_URL[id] + '/Icon_' + id + '.gif');
  let n = 0;
  img.onerror = () => { n++; if (n < fuentes.length) img.src = fuentes[n]; else wrap.innerHTML = fallbackSvg; };
  img.src = fuentes[0];
  wrap.appendChild(img);
  return wrap;
}
const PLAYER_SVG = `<svg width="38" height="38" viewBox="0 0 22 22"><path d="M11 1.5 L19.5 19.5 L11 15.2 L2.5 19.5 Z" fill="#fff" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
const DEST_SVG = `<svg width="30" height="40" viewBox="0 0 30 40"><path d="M15 39C15 39 3 23 3 14a12 12 0 0 1 24 0c0 9-12 25-12 25z" fill="#e0262b" stroke="#000" stroke-width="2.5"/><rect x="10" y="9" width="10" height="10" fill="#fff" stroke="#000" stroke-width="1.5"/></svg>`;
const el = html => { const d = document.createElement('div'); d.innerHTML = html; return d; };

/* --------------------------------- mapa ---------------------------------- */
const map = new maplibregl.Map({
  container: 'map', style, center: CONFIG.inicio, zoom: 15, maxPitch: 70,
  attributionControl: { compact: true, customAttribution: '© OpenStreetMap · OpenFreeMap' },
});
const playerEl = saImg(2, 30, PLAYER_SVG); playerEl.className = 'player';
const player = new maplibregl.Marker({ element: playerEl, rotationAlignment: 'map', pitchAlignment: 'map' }).setLngLat(CONFIG.inicio).addTo(map);
let destMarker = null, poiMarkers = [];

const S = {
  pos: null, heading: 0, speed: 0, follow: true, voice: true,
  dest: null, destName: '', route: null, coords: [], cum: [], steps: [],
  navigating: false, lastReroute: 0, offCount: 0, lastSpoken: '', lastZonePos: null,
};

/* reloj */
const tick = () => $('clock').textContent = fmtClock(new Date());
tick(); setInterval(tick, 1000);

/* ----------------------------------- GPS ---------------------------------- */
function camera(){
  if (!S.pos || !S.follow) return;
  if (S.navigating) map.easeTo({ center: S.pos, bearing: S.heading, pitch: CONFIG.inclinacionNav, zoom: 17.2, duration: 900, offset: [0, map.getContainer().clientHeight * 0.18] });
  else map.easeTo({ center: S.pos, duration: 700 });
}
function onPosition(p){
  const now = [p.coords.longitude, p.coords.latitude];
  const prev = S.pos; S.pos = now;
  if (p.coords.heading != null && !isNaN(p.coords.heading) && (p.coords.speed || 0) > 0.8) S.heading = p.coords.heading;
  else if (prev && dist(prev, now) > 4) S.heading = bearing(prev, now);
  S.speed = p.coords.speed != null && !isNaN(p.coords.speed) ? p.coords.speed * 3.6 : S.speed * 0.7;
  $('speed').innerHTML = String(Math.max(0, Math.round(S.speed))).padStart(3, '0') + '<span> KM/H</span>';
  player.setLngLat(now).setRotation(S.heading);
  if (!prev) { map.jumpTo({ center: now, zoom: 16 }); updateZone(true); } else { camera(); updateZone(false); }
  if (S.navigating) progress();
}
function onPosError(e){
  toast(e.code === 1 ? 'Permite el acceso a tu ubicación para usar el GPS.' : 'No se pudo obtener tu ubicación.');
  if (!S.pos) { S.pos = CONFIG.inicio; player.setLngLat(S.pos); updateZone(true); }
}
if ('geolocation' in navigator) navigator.geolocation.watchPosition(onPosition, onPosError, { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 });
else onPosError({ code: 0 });
window.addEventListener('deviceorientationabsolute', ev => {
  if (S.speed < 3 && ev.alpha != null) { S.heading = (360 - ev.alpha) % 360; player.setRotation(S.heading); }
}, true);

map.on('dragstart', () => { S.follow = false; });

/* aviso si el mapa no logra cargar (p. ej. abierto como archivo local) */
let mapError = '';
map.on('error', e => { mapError = (e && e.error && e.error.message) || 'error'; console.warn('Mapa:', mapError); });
setTimeout(() => {
  if (map.isStyleLoaded()) return;
  const local = !/^https?:$/.test(location.protocol);
  toast(local ? 'El mapa no carga si abres el archivo desde el teléfono. Súbelo a GitHub Pages (https) y ábrelo desde ahí.'
              : 'No se pudo cargar el mapa. Revisa tu conexión. ' + (mapError ? '(' + mapError + ')' : ''), 12000);
}, 8000);

/* mantener presionado (o clic derecho) = marcar destino */
let pressT;
map.on('contextmenu', e => setDestination([e.lngLat.lng, e.lngLat.lat], 'Punto marcado', ''));
map.on('touchstart', e => { if (e.originalEvent.touches.length !== 1) return; const ll = e.lngLat; pressT = setTimeout(() => setDestination([ll.lng, ll.lat], 'Punto marcado', ''), 650); });
['touchend', 'touchmove', 'dragstart', 'zoomstart'].forEach(ev => map.on(ev, () => clearTimeout(pressT)));

/* ------------------- nombre de zona (como "GROVE STREET") ----------------- */
async function updateZone(force){
  if (!S.pos) return;
  if (!force && S.lastZonePos && dist(S.lastZonePos, S.pos) < 400) return;
  S.lastZonePos = S.pos;
  try {
    const r = await fetch(`${CONFIG.nominatim}reverse?format=jsonv2&zoom=16&accept-language=es&lat=${S.pos[1]}&lon=${S.pos[0]}`);
    const a = (await r.json()).address || {};
    const name = a.neighbourhood || a.suburb || a.quarter || a.city_district || a.road || a.city || a.town;
    if (name && name !== $('zone').dataset.last) {
      $('zone').dataset.last = name; $('zone').textContent = name; $('zone').classList.add('show');
      clearTimeout(zoneT); zoneT = setTimeout(() => $('zone').classList.remove('show'), 4500);
    }
  } catch(e){}
}

/* -------------------------------- búsqueda -------------------------------- */
let searchT;
async function search(text){
  text = text.trim(); const box = $('results');
  if (text.length < 3) { box.style.display = 'none'; return; }
  const c = S.pos || CONFIG.inicio;
  const vb = [c[0]-0.6, c[1]+0.6, c[0]+0.6, c[1]-0.6].join(',');
  try {
    const r = await fetch(`${CONFIG.nominatim}search?format=jsonv2&limit=6&accept-language=es&viewbox=${vb}&q=${encodeURIComponent(text)}`);
    const list = await r.json();
    box.innerHTML = list.length ? '' : '<div>Sin resultados</div>';
    list.forEach(it => {
      const d = document.createElement('div'); const parts = it.display_name.split(',');
      d.innerHTML = `${parts[0]}<small>${parts.slice(1, 4).join(',')}</small>`;
      d.onclick = () => { box.style.display = 'none'; $('q').blur(); setDestination([+it.lon, +it.lat], parts[0], parts.slice(1, 3).join(',')); };
      box.appendChild(d);
    });
    box.style.display = 'block';
  } catch(e){ toast('Error buscando. Revisa tu conexión.'); }
}
$('q').addEventListener('input', e => { clearTimeout(searchT); searchT = setTimeout(() => search(e.target.value), 450); });
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') search(e.target.value); });
document.addEventListener('click', e => { if (!$('top').contains(e.target)) $('results').style.display = 'none'; });

/* ----------------------------- destino y ruta ----------------------------- */
async function setDestination(ll, name, sub){
  S.dest = ll; S.destName = name;
  if (destMarker) destMarker.remove();
  destMarker = new maplibregl.Marker({ element: (() => { const d = saImg(41, 26, DEST_SVG); d.className = 'blip'; return d; })() }).setLngLat(ll).addTo(map);
  $('cardTitle').textContent = name; $('cardSub').textContent = sub || `${ll[1].toFixed(5)}, ${ll[0].toFixed(5)}`;
  document.body.classList.add('has-card');
  ['stDist','stTime','stEta'].forEach(id => $(id).textContent = '…');
  S.follow = false;
  await calcRoute(true);
}
async function calcRoute(fit){
  if (!S.dest) return;
  const from = S.pos || CONFIG.inicio;
  try {
    const r = await fetch(`${CONFIG.osrm}${CONFIG.perfil}/${from[0]},${from[1]};${S.dest[0]},${S.dest[1]}?overview=full&geometries=geojson&steps=true`);
    const j = await r.json();
    if (!j.routes || !j.routes.length) throw 0;
    const rt = j.routes[0]; S.route = rt;
    S.coords = rt.geometry.coordinates;
    S.cum = [0]; for (let i = 1; i < S.coords.length; i++) S.cum.push(S.cum[i-1] + dist(S.coords[i-1], S.coords[i]));
    S.steps = rt.legs[0].steps.map(st => ({ st, idx: nearestIndex(st.maneuver.location).i }));
    map.getSource('ruta').setData({ type: 'Feature', geometry: rt.geometry });
    if (fit) {
      const b = new maplibregl.LngLatBounds(); S.coords.forEach(c => b.extend(c));
      map.fitBounds(b, { padding: { top: 90, bottom: 240, left: 40, right: 40 }, pitch: 0, bearing: 0, duration: 900 });
    }
    updateStats(rt.distance, rt.duration);
    if (S.navigating) progress();
  } catch(e){ toast('No se encontró una ruta hasta ese punto.'); }
}
function updateStats(m, s){
  const eta = fmtClock(new Date(Date.now() + s*1000));
  $('stDist').textContent = fmtDist(m); $('stTime').textContent = fmtTime(s); $('stEta').textContent = eta;
  $('tEta').textContent = eta; $('tMin').textContent = Math.max(1, Math.round(s/60)); $('tKm').textContent = (m/1000).toFixed(1);
}
function clearRoute(){
  Object.assign(S, { dest: null, route: null, coords: [], steps: [], navigating: false });
  if (map.getSource('ruta')) map.getSource('ruta').setData({ type: 'FeatureCollection', features: [] });
  if (destMarker) { destMarker.remove(); destMarker = null; }
  document.body.classList.remove('nav', 'has-card');
  map.easeTo({ pitch: 0, bearing: 0, zoom: 16, duration: 800, center: S.pos || undefined });
}

/* ------------------------- seguimiento de la ruta ------------------------- */
function nearestIndex(p){
  let best = Infinity, bi = 0;
  for (let i = 0; i < S.coords.length; i++){ const d = dist(p, S.coords[i]); if (d < best) { best = d; bi = i; } }
  return { i: bi, d: best };
}
function segDistance(p, a, b){
  const k = Math.cos(toRad(p[1])) * 111320, kl = 110540;
  const ax = (a[0]-p[0])*k, ay = (a[1]-p[1])*kl, bx = (b[0]-p[0])*k, by = (b[1]-p[1])*kl;
  const dx = bx-ax, dy = by-ay, len = dx*dx + dy*dy;
  let t = len ? -(ax*dx + ay*dy)/len : 0; t = Math.max(0, Math.min(1, t));
  return { d: Math.hypot(ax + t*dx, ay + t*dy), t };
}
function progress(){
  if (!S.coords.length || !S.pos) return;
  const n = nearestIndex(S.pos);
  let off = n.d, along = S.cum[n.i];
  [n.i - 1, n.i].forEach(i => {
    if (i >= 0 && i < S.coords.length - 1){
      const sd = segDistance(S.pos, S.coords[i], S.coords[i+1]);
      if (sd.d <= off) { off = sd.d; along = S.cum[i] + sd.t * (S.cum[i+1] - S.cum[i]); }
    }
  });
  const total = S.cum[S.cum.length - 1], remaining = Math.max(0, total - along);
  if (dist(S.pos, S.dest) < 25 || remaining < 15){
    speak('Has llegado a tu destino'); banner('¡Llegaste!', S.destName + '  ·  RESPETO +', 5000); clearRoute(); return;
  }
  if (off > CONFIG.desvioMetros){
    if (++S.offCount >= 2 && Date.now() - S.lastReroute > 8000){ S.lastReroute = Date.now(); S.offCount = 0; toast('Recalculando ruta…', 2000); calcRoute(false); return; }
  } else S.offCount = 0;
  const next = S.steps.find(s => S.cum[s.idx] > along + 8 && s.st.maneuver.type !== 'depart') || S.steps[S.steps.length - 1];
  const dNext = Math.max(0, S.cum[next.idx] - along);
  $('instrDist').textContent = fmtDist(dNext);
  $('instrText').textContent = instruccion(next.st);
  drawArrow(next.st);
  updateStats(remaining, S.route.duration * (total ? remaining / total : 0));
  if (dNext < 220){
    const key = next.idx + (dNext < 50 ? 'b' : 'a');
    if (key !== S.lastSpoken){ S.lastSpoken = key; speak((dNext < 50 ? 'Ahora, ' : 'En ' + Math.round(dNext/10)*10 + ' metros, ') + instruccion(next.st).toLowerCase()); }
  }
}

/* ------------------------ instrucciones en español ------------------------ */
const MOD = { 'left':'a la izquierda', 'right':'a la derecha', 'slight left':'ligeramente a la izquierda', 'slight right':'ligeramente a la derecha', 'sharp left':'fuerte a la izquierda', 'sharp right':'fuerte a la derecha', 'straight':'recto', 'uturn':'en U' };
function instruccion(st){
  const m = st.maneuver, via = st.name ? ' por ' + st.name : '', mod = MOD[m.modifier] || '';
  switch (m.type){
    case 'depart': return 'Sal' + via;
    case 'arrive': return 'Llegas a ' + S.destName;
    case 'turn': case 'end of road': return (m.modifier === 'uturn' ? 'Da la vuelta en U' : 'Gira ' + mod) + via;
    case 'continue': case 'new name': return (m.modifier && m.modifier !== 'straight' ? 'Sigue ' + mod : 'Sigue recto') + via;
    case 'merge': return 'Incorpórate ' + mod + via;
    case 'on ramp': return 'Toma la entrada ' + mod + via;
    case 'off ramp': return 'Toma la salida ' + mod + via;
    case 'fork': return 'En la bifurcación, mantente ' + mod + via;
    case 'roundabout': case 'rotary': case 'roundabout turn': return 'En el óvalo, toma la ' + (m.exit ? m.exit + 'ª salida' : 'salida') + via;
    default: return (mod ? 'Ve ' + mod : 'Continúa') + via;
  }
}
function drawArrow(st){
  const m = st.maneuver;
  if (m.type === 'arrive') { $('instrIcon').innerHTML = DEST_SVG.replace('width="30" height="40"', 'x="11" y="4" width="30" height="40"'); return; }
  const rot = { 'left':-90, 'right':90, 'slight left':-45, 'slight right':45, 'sharp left':-135, 'sharp right':135 }[m.modifier] || 0;
  const arrow = m.modifier === 'uturn'
    ? `<path d="M34 46V20a8 8 0 0 0-16 0v6" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/><path d="M10 24h16l-8 12z" fill="#fff"/>`
    : `<g transform="rotate(${rot} 26 30)"><path d="M26 48V18" stroke="#fff" stroke-width="7" stroke-linecap="round"/><path d="M14 22L26 6l12 16z" fill="#fff" stroke-linejoin="round"/></g>`;
  $('instrIcon').innerHTML = (/roundabout|rotary/.test(m.type) ? `<circle cx="26" cy="30" r="12" fill="none" stroke="#acc8ff" stroke-width="3" stroke-dasharray="4 3"/>` : '') + arrow;
}

/* ---------------------------------- voz ---------------------------------- */
function speak(t){
  if (!S.voice || !('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(t); u.lang = 'es-ES'; u.rate = 1.02;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

/* ------------------------- lugares cercanos (blips) ------------------------ */
let poiOn = false, poiT;
async function loadPOIs(){
  if (map.getZoom() < 14) { toast('Acércate más al mapa para ver los lugares.'); return; }
  const b = map.getBounds(), bbox = [b.getSouth(), b.getWest(), b.getNorth(), b.getEast()].join(',');
  const q = '[out:json][timeout:20];(' + POI_TIPOS.map(t => { const [k, v] = t.k.split('='); return `node["${k}"="${v}"](${bbox});way["${k}"="${v}"](${bbox});`; }).join('') + ');out center 300;';
  try {
    const r = await fetch(CONFIG.overpass, { method: 'POST', body: 'data=' + encodeURIComponent(q) });
    const j = await r.json();
    poiMarkers.forEach(m => m.remove()); poiMarkers = [];
    j.elements.forEach(e => {
      const lat = e.lat ?? e.center?.lat, lon = e.lon ?? e.center?.lon; if (lat == null) return;
      const tg = e.tags || {};
      const tipo = POI_TIPOS.slice().reverse().find(t => { const [k, v] = t.k.split('='); return tg[k] === v; }) || POI_TIPOS[0];
      const name = tg.name || tipo.nombre;
      const box = document.createElement('div'); box.innerHTML = `<b>${name}</b><br>${tipo.nombre}`;
      const go = document.createElement('button'); go.className = 'btn primary'; go.textContent = 'Ir aquí';
      const pop = new maplibregl.Popup({ offset: 14, closeButton: true }).setDOMContent(box);
      go.onclick = () => { pop.remove(); setDestination([lon, lat], name, tipo.nombre); };
      box.appendChild(go);
      const icon = saImg(tipo.sa, 24, ICONOS[tipo.icon]); icon.className = 'blip';
      poiMarkers.push(new maplibregl.Marker({ element: icon }).setLngLat([lon, lat]).setPopup(pop).addTo(map));
    });
    if (!j.elements.length) toast('No hay lugares registrados en esta zona.');
  } catch(e){ toast('No se pudieron cargar los lugares.'); }
}
$('btnPoi').onclick = () => {
  poiOn = !poiOn; $('btnPoi').classList.toggle('on', poiOn);
  if (poiOn) loadPOIs(); else { poiMarkers.forEach(m => m.remove()); poiMarkers = []; }
};
map.on('moveend', () => { if (poiOn && !S.navigating) { clearTimeout(poiT); poiT = setTimeout(loadPOIs, 900); } });

/* --------------------------------- botones -------------------------------- */
$('btnVoice').onclick = () => { S.voice = !S.voice; $('btnVoice').classList.toggle('on', S.voice); toast(S.voice ? 'Voz activada' : 'Voz desactivada', 1500); };
$('btnCenter').onclick = () => { S.follow = true; if (S.pos) S.navigating ? camera() : map.easeTo({ center: S.pos, zoom: 16, pitch: 0, bearing: 0 }); };
$('btnGo').onclick = () => {
  if (!S.route) return;
  S.navigating = true; S.follow = true; S.lastSpoken = '';
  document.body.classList.add('nav');
  banner('Ruta iniciada', S.destName, 2500);
  camera(); progress(); speak('Ruta iniciada hacia ' + S.destName);
};
$('btnCancel').onclick = clearRoute;
$('btnEnd').onclick = clearRoute;
</script>
